<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Cancelled — DUKA YANGU POS</title>
<style>
  body { margin:0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; background:#F1F5F9; color:#07111F; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#FFFFFF; border-radius:12px; box-shadow:0 10px 30px rgba(6,26,64,0.1); max-width:400px; width:90%; padding:40px 32px; text-align:center; }
  .brand { color:#061A40; font-weight:900; font-size:20px; margin-bottom:4px; }
  .brand span { color:#008C72; }
  .status-icon { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:20px auto; font-size:28px; color:#fff; background:#F59E0B; }
  h1 { font-size:18px; margin:8px 0; }
  p { color:#64748B; font-size:14px; line-height:1.5; }
  .hint { margin-top:18px; font-size:12px; color:#94A3B8; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">DUKA YANGU <span>POS</span></div>
    <div class="status-icon">!</div>
    <h1>Payment Cancelled</h1>
    <p>This sale's card payment was cancelled and no charge was made.</p>
    <p class="hint">You can close this tab and return to the till to retry.</p>
    <p class="hint" id="debug"></p>
  </div>
<script>
const saleId = "{{ sale_id }}";
const debugEl = document.getElementById('debug');
if (saleId) {
    fetch(`/api/v1/sales/${saleId}/cancel/`, { method: 'POST' })
        .then(response => { if (!response.ok) debugEl.textContent = 'Note: could not mark sale cancelled.'; })
        .catch(() => { debugEl.textContent = 'Network error while cancelling.'; });
}
</script>
</body>
</html>
