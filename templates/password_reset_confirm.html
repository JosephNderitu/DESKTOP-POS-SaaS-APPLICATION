<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password — DUKA YANGU POS</title>
<style>
  body { margin:0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; background:#F1F5F9; color:#07111F; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#FFFFFF; border-radius:12px; box-shadow:0 10px 30px rgba(6,26,64,0.1); max-width:380px; width:90%; padding:36px 32px; }
  .brand { color:#061A40; font-weight:900; font-size:20px; text-align:center; margin-bottom:20px; }
  .brand span { color:#008C72; }
  h1 { font-size:16px; margin:0 0 6px; }
  p.sub { color:#64748B; font-size:13px; margin:0 0 20px; }
  input { width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid #D6DEE8; border-radius:5px; font-size:14px; margin-bottom:12px; }
  input:focus { outline:none; border-color:#008C72; }
  button { width:100%; padding:12px; background:#008C72; color:#fff; border:none; border-radius:5px; font-weight:700; font-size:14px; cursor:pointer; }
  button:hover { background:#006F5B; }
  button:disabled { background:#94A3B8; }
  .message { margin-top:14px; font-size:13px; text-align:center; }
  .message.error { color:#DC2626; }
  .message.success { color:#008C72; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">DUKA YANGU<span> POS</span></div>
    <h1>Set a new password</h1>
    <p class="sub">for your account at <b>{{ store_name }}</b></p>
    <input type="password" id="newPassword" placeholder="New password (min. 8 characters)">
    <input type="password" id="confirmPassword" placeholder="Confirm new password">
    <button id="submitBtn">Reset Password</button>
    <div id="message" class="message"></div>
  </div>
<script>
const uid = "{{ uid }}";
const token = "{{ token }}";
const btn = document.getElementById('submitBtn');
const msg = document.getElementById('message');

btn.addEventListener('click', async () => {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    msg.textContent = '';
    msg.className = 'message';

    if (newPassword.length < 8) {
        msg.textContent = 'Password must be at least 8 characters.';
        msg.classList.add('error');
        return;
    }
    if (newPassword !== confirmPassword) {
        msg.textContent = 'Passwords do not match.';
        msg.classList.add('error');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
        const response = await fetch('/api/v1/password-reset/confirm/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ uid, token, new_password: newPassword })
        });
        const data = await response.json();
        if (response.ok) {
            msg.textContent = data.message + ' You can close this tab and log in from the desktop app.';
            msg.classList.add('success');
            document.getElementById('newPassword').disabled = true;
            document.getElementById('confirmPassword').disabled = true;
            btn.style.display = 'none';
        } else {
            msg.textContent = data.error || 'Something went wrong.';
            msg.classList.add('error');
            btn.disabled = false;
            btn.textContent = 'Reset Password';
        }
    } catch (err) {
        msg.textContent = 'Network error. Please try again.';
        msg.classList.add('error');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
    }
});
</script>
</body>
</html>
