<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Cancelled — RVC POS</title>
<style>
  body { margin:0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; background:#F1F5F9; color:#07111F; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#FFFFFF; border-radius:12px; box-shadow:0 10px 30px rgba(6,26,64,0.1); max-width:420px; width:90%; padding:40px 32px; text-align:center; }
  .brand { color:#061A40; font-weight:900; font-size:20px; margin-bottom:4px; }
  .brand span { color:#008C72; }
  .status-icon { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:20px auto; font-size:28px; color:#fff; background:#F59E0B; }
  h1 { font-size:18px; margin:8px 0; }
  p { color:#64748B; font-size:14px; line-height:1.5; }
  .hint { margin-top:18px; font-size:12px; color:#94A3B8; }
  .debug { margin-top:14px; font-size:11px; color:#CBD5E1; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">DUKA YANGU <span>POS</span></div>
    <div class="status-icon">!</div>
    <h1>Checkout Cancelled</h1>
    <p>Your subscription checkout was cancelled and you have not been charged.</p>
    <p class="hint">You can now close this browser tab and return to the POS desktop app.</p>
    <p class="debug" id="debug"></p>
  </div>
<script>
const txnId = "{{ transaction_id }}";
const debugEl = document.getElementById('debug');

if (txnId) {
    fetch('/api/v1/billing/cancel/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ transaction_id: parseInt(txnId, 10) })
    })
    .then(response => response.json().then(data => ({ ok: response.ok, data })))
    .then(({ ok, data }) => {
        // Visible confirmation instead of a silent catch — makes failures
        // obvious during testing instead of hiding them
        debugEl.textContent = ok ? '' : 'Note: could not mark transaction cancelled (' + (data.error || 'unknown error') + ')';
    })
    .catch(err => {
        debugEl.textContent = 'Network error while cancelling: ' + err.message;
    });
} else {
    debugEl.textContent = 'No transaction reference was present in this link.';
}
</script>
</body>
</html>
