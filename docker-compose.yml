services:
  db:
    image: postgres:15-alpine
    container_name: saas_pos_postgres
    restart: always
    environment:
      POSTGRES_DB: saas_pos_db
      POSTGRES_USER: pos_admin
      POSTGRES_PASSWORD: secure_pos_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: